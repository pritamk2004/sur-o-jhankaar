apiVersion: apps/v1
kind: Deployment
metadata:
  name: sur-server
  namespace: sur-o-jhankaar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sur-server
  template:
    metadata:
      labels:
        app: sur-server
    spec:
      containers:
        - name: server
          image: sur-server:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: sur-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sur-server-service
  namespace: sur-o-jhankaar
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: sur-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sur-web
  namespace: sur-o-jhankaar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sur-web
  template:
    metadata:
      labels:
        app: sur-web
    spec:
      containers:
        - name: web
          image: sur-web:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sur-web-service
  namespace: sur-o-jhankaar
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: sur-web
