version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: sur_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: sur_o_jhankaar
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: sur_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-engine:
    build:
      context: .
      dockerfile: python-engine/Dockerfile
    container_name: sur_python_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: sur_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/sur_o_jhankaar
      - REDIS_URL=redis://redis:6379
      - PYTHON_ENGINE_URL=http://python-engine:8000
      - JWT_SECRET=sur_jwt_super_secret_production_key_2026
      - JWT_REFRESH_SECRET=sur_jwt_refresh_super_secret_key_2026
      - CLIENT_URL=http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-engine:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sur_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: sur_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - server

volumes:
  mongo_data:
  redis_data:
